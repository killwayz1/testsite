<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1e44"/>
      <stop offset="55%" stop-color="#142a63"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="chartArea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Soft horizontal grid lines (price levels) -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="350" x2="1600" y2="350"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="650" x2="1600" y2="650"/>
  </g>

  <!-- Secondary chart (cool blue area) -->
  <path d="M0,620 C140,560 240,640 360,580 C500,510 620,600 780,520 C920,460 1060,540 1220,470 C1360,420 1480,490 1600,440 L1600,900 L0,900 Z"
        fill="url(#chartArea2)"/>
  <path d="M0,620 C140,560 240,640 360,580 C500,510 620,600 780,520 C920,460 1060,540 1220,470 C1360,420 1480,490 1600,440"
        fill="none" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="2.5"/>

  <!-- Primary chart (warm amber area) -->
  <path d="M0,560 C160,520 280,440 420,420 C560,400 680,500 820,460 C960,420 1080,320 1240,300 C1380,285 1480,330 1600,290 L1600,900 L0,900 Z"
        fill="url(#chartArea)"/>
  <path d="M0,560 C160,520 280,440 420,420 C560,400 680,500 820,460 C960,420 1080,320 1240,300 C1380,285 1480,330 1600,290"
        fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Candlesticks (right side, layered atop chart) -->
  <g>
    <!-- group of candles -->
    <g transform="translate(900,0)">
      <!-- green candle -->
      <line x1="20" y1="380" x2="20" y2="500" stroke="#34d399" stroke-width="2"/>
      <rect x="12" y="410" width="16" height="70" fill="#34d399"/>
      <!-- red candle -->
      <line x1="60" y1="360" x2="60" y2="490" stroke="#f87171" stroke-width="2"/>
      <rect x="52" y="380" width="16" height="80" fill="#f87171"/>
      <!-- green candle -->
      <line x1="100" y1="340" x2="100" y2="470" stroke="#34d399" stroke-width="2"/>
      <rect x="92" y="365" width="16" height="80" fill="#34d399"/>
      <!-- green candle -->
      <line x1="140" y1="310" x2="140" y2="440" stroke="#34d399" stroke-width="2"/>
      <rect x="132" y="330" width="16" height="80" fill="#34d399"/>
      <!-- red candle -->
      <line x1="180" y1="290" x2="180" y2="420" stroke="#f87171" stroke-width="2"/>
      <rect x="172" y="310" width="16" height="80" fill="#f87171"/>
      <!-- green candle -->
      <line x1="220" y1="260" x2="220" y2="400" stroke="#34d399" stroke-width="2"/>
      <rect x="212" y="280" width="16" height="80" fill="#34d399"/>
      <!-- green candle -->
      <line x1="260" y1="240" x2="260" y2="370" stroke="#34d399" stroke-width="2"/>
      <rect x="252" y="260" width="16" height="80" fill="#34d399"/>
      <!-- red candle -->
      <line x1="300" y1="225" x2="300" y2="370" stroke="#f87171" stroke-width="2"/>
      <rect x="292" y="245" width="16" height="60" fill="#f87171"/>
      <!-- green candle -->
      <line x1="340" y1="200" x2="340" y2="345" stroke="#34d399" stroke-width="2"/>
      <rect x="332" y="220" width="16" height="80" fill="#34d399"/>
      <!-- green candle -->
      <line x1="380" y1="180" x2="380" y2="320" stroke="#34d399" stroke-width="2"/>
      <rect x="372" y="200" width="16" height="80" fill="#34d399"/>
      <!-- red candle -->
      <line x1="420" y1="170" x2="420" y2="320" stroke="#f87171" stroke-width="2"/>
      <rect x="412" y="195" width="16" height="65" fill="#f87171"/>
      <!-- green candle -->
      <line x1="460" y1="150" x2="460" y2="290" stroke="#34d399" stroke-width="2"/>
      <rect x="452" y="170" width="16" height="80" fill="#34d399"/>
      <!-- green candle -->
      <line x1="500" y1="135" x2="500" y2="270" stroke="#34d399" stroke-width="2"/>
      <rect x="492" y="155" width="16" height="80" fill="#34d399"/>
      <!-- last big green -->
      <line x1="540" y1="115" x2="540" y2="265" stroke="#34d399" stroke-width="2"/>
      <rect x="532" y="135" width="16" height="100" fill="#34d399"/>
    </g>
  </g>

  <!-- Marker dot on amber line -->
  <circle cx="1240" cy="300" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1240" cy="300" r="20" fill="#f59e0b" fill-opacity="0.18"/>

  <!-- Small label tag near marker -->
  <g transform="translate(1265,260)">
    <rect x="0" y="0" width="180" height="48" rx="10" fill="#0b1e44" stroke="#f59e0b" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="16" y="20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">BTC / USD</text>
    <text x="16" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f59e0b">+12.4%</text>
  </g>

  <!-- Ticker tape (bottom bar) -->
  <g transform="translate(0,820)">
    <rect width="1600" height="80" fill="#0b1e44" fill-opacity="0.65"/>
    <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
      <text x="60" y="48" fill="#cbd5e1">BTC <tspan fill="#34d399">▲ 64,820</tspan></text>
      <text x="260" y="48" fill="#cbd5e1">ETH <tspan fill="#34d399">▲ 3,412</tspan></text>
      <text x="440" y="48" fill="#cbd5e1">EUR/USD <tspan fill="#f87171">▼ 1.0842</tspan></text>
      <text x="660" y="48" fill="#cbd5e1">GBP/CAD <tspan fill="#34d399">▲ 1.7340</tspan></text>
      <text x="880" y="48" fill="#cbd5e1">XAU <tspan fill="#34d399">▲ 2,381</tspan></text>
      <text x="1040" y="48" fill="#cbd5e1">TSX <tspan fill="#34d399">▲ 22,194</tspan></text>
      <text x="1220" y="48" fill="#cbd5e1">S&amp;P 500 <tspan fill="#f87171">▼ 5,221</tspan></text>
      <text x="1420" y="48" fill="#cbd5e1">SOL <tspan fill="#34d399">▲ 168</tspan></text>
    </g>
  </g>

  <!-- Soft top-left vignette -->
  <rect width="1600" height="900" fill="url(#bg)" opacity="0.0"/>
</svg>
