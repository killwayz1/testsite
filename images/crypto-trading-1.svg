<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1f47"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dashCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2f5f"/>
      <stop offset="100%" stop-color="#172044"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#dashBg)"/>

  <!-- Window chrome -->
  <rect x="60" y="60" width="1080" height="680" rx="20" fill="#0b1a3d" stroke="#2b3e75" stroke-width="1"/>
  <rect x="60" y="60" width="1080" height="48" rx="20" fill="#0e225a"/>
  <rect x="60" y="92" width="1080" height="16" fill="#0e225a"/>
  <circle cx="92" cy="84" r="7" fill="#f87171"/>
  <circle cx="116" cy="84" r="7" fill="#f59e0b"/>
  <circle cx="140" cy="84" r="7" fill="#34d399"/>
  <text x="600" y="89" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">opulatrix-canada.com / trading</text>

  <!-- Sidebar -->
  <rect x="80" y="128" width="200" height="592" rx="12" fill="url(#dashCard)"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">
    <rect x="96" y="148" width="168" height="40" rx="8" fill="#1d4ed8"/>
    <text x="120" y="173" fill="#ffffff" font-weight="600">Dashboard</text>
    <text x="120" y="223" >Markets</text>
    <text x="120" y="263">Portfolio</text>
    <text x="120" y="303">AI Signals</text>
    <text x="120" y="343">Auto-Trader</text>
    <text x="120" y="383">Education</text>
    <text x="120" y="423">Wallet</text>
    <text x="120" y="463">Reports</text>
    <text x="120" y="503">Settings</text>
  </g>

  <!-- Main chart card -->
  <rect x="300" y="128" width="600" height="380" rx="12" fill="url(#dashCard)"/>
  <text x="324" y="160" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">BTC / CAD · 1H</text>
  <text x="324" y="190" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">88,420.50</text>
  <text x="490" y="190" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#34d399">+2.84%</text>

  <!-- Grid lines -->
  <g stroke="#1e3a8a" stroke-width="1">
    <line x1="320" y1="250" x2="880" y2="250"/>
    <line x1="320" y1="320" x2="880" y2="320"/>
    <line x1="320" y1="390" x2="880" y2="390"/>
    <line x1="320" y1="460" x2="880" y2="460"/>
  </g>

  <!-- Area chart -->
  <path d="M320,420 C400,380 460,440 540,400 C620,360 700,300 780,290 C840,283 860,310 880,260 L880,490 L320,490 Z" fill="url(#chartFill)"/>
  <path d="M320,420 C400,380 460,440 540,400 C620,360 700,300 780,290 C840,283 860,310 880,260" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="880" cy="260" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>

  <!-- Right column: AI signals -->
  <rect x="920" y="128" width="200" height="380" rx="12" fill="url(#dashCard)"/>
  <text x="940" y="158" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">AI Signals</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <rect x="936" y="180" width="168" height="56" rx="8" fill="#0f1d44" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="952" y="200" fill="#ffffff" font-weight="600">ETH / USD</text>
    <text x="952" y="222" fill="#34d399">BUY · 78% conf</text>

    <rect x="936" y="248" width="168" height="56" rx="8" fill="#0f1d44" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="952" y="268" fill="#ffffff" font-weight="600">XAU / USD</text>
    <text x="952" y="290" fill="#f59e0b">HOLD · 64% conf</text>

    <rect x="936" y="316" width="168" height="56" rx="8" fill="#0f1d44" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="952" y="336" fill="#ffffff" font-weight="600">SOL / USD</text>
    <text x="952" y="358" fill="#34d399">BUY · 72% conf</text>

    <rect x="936" y="384" width="168" height="56" rx="8" fill="#0f1d44" stroke="#f87171" stroke-opacity="0.4"/>
    <text x="952" y="404" fill="#ffffff" font-weight="600">EUR / USD</text>
    <text x="952" y="426" fill="#f87171">SELL · 69% conf</text>
  </g>

  <!-- Bottom KPI cards -->
  <g>
    <rect x="300" y="528" width="190" height="180" rx="12" fill="url(#dashCard)"/>
    <text x="320" y="558" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">Portfolio Value</text>
    <text x="320" y="600" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">$24,180</text>
    <text x="320" y="624" font-family="Inter, Arial, sans-serif" font-size="13" fill="#34d399">▲ $612 today</text>

    <rect x="505" y="528" width="190" height="180" rx="12" fill="url(#dashCard)"/>
    <text x="525" y="558" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">Open Positions</text>
    <text x="525" y="600" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">7</text>
    <text x="525" y="624" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">across 4 markets</text>

    <rect x="710" y="528" width="190" height="180" rx="12" fill="url(#dashCard)"/>
    <text x="730" y="558" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">Win Rate (30d)</text>
    <text x="730" y="600" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#f59e0b">71%</text>
    <text x="730" y="624" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">112 of 158 trades</text>

    <rect x="920" y="528" width="200" height="180" rx="12" fill="url(#dashCard)"/>
    <text x="940" y="558" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">Risk Level</text>
    <text x="940" y="600" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#34d399">Moderate</text>
    <text x="940" y="624" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbd5e1">auto-balanced</text>
  </g>
</svg>
