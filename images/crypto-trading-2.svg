<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b1e44"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2f5f"/>
      <stop offset="100%" stop-color="#162045"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg2)"/>

  <!-- Top header -->
  <text x="600" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff">Diversified Portfolio Allocation</text>
  <text x="600" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">Multi-asset exposure across crypto, equities, forex, commodities</text>

  <!-- Donut chart -->
  <g transform="translate(370,440)">
    <!-- Crypto 35% (gold) -->
    <path d="M 0,-180 A 180,180 0 0,1 171.21,55.62 L 0,0 Z" fill="#f59e0b"/>
    <!-- Forex 25% (amber lighter) -->
    <path d="M 171.21,55.62 A 180,180 0 0,1 0,180 L 0,0 Z" fill="#fbbf24"/>
    <!-- Stocks 20% (blue lighter) -->
    <path d="M 0,180 A 180,180 0 0,1 -171.21,55.62 L 0,0 Z" fill="#60a5fa"/>
    <!-- Commodities 12% (blue) -->
    <path d="M -171.21,55.62 A 180,180 0 0,1 -105.8,-145.7 L 0,0 Z" fill="#3b82f6"/>
    <!-- Cash 8% (deep blue) -->
    <path d="M -105.8,-145.7 A 180,180 0 0,1 0,-180 L 0,0 Z" fill="#1e40af"/>

    <!-- inner cutout -->
    <circle cx="0" cy="0" r="100" fill="#0b1e44"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">Total AUM</text>
    <text x="0" y="24" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">$2.4M</text>
  </g>

  <!-- Legend / breakdown panel -->
  <rect x="720" y="240" width="400" height="420" rx="16" fill="url(#card2)"/>
  <text x="744" y="278" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Asset Breakdown</text>

  <g font-family="Inter, Arial, sans-serif" font-size="16">
    <rect x="744" y="300" width="18" height="18" rx="4" fill="#f59e0b"/>
    <text x="772" y="315" fill="#cbd5e1">Crypto (BTC, ETH, SOL)</text>
    <text x="1096" y="315" text-anchor="end" font-weight="700" fill="#ffffff">35%</text>

    <rect x="744" y="340" width="18" height="18" rx="4" fill="#fbbf24"/>
    <text x="772" y="355" fill="#cbd5e1">Forex (Majors)</text>
    <text x="1096" y="355" text-anchor="end" font-weight="700" fill="#ffffff">25%</text>

    <rect x="744" y="380" width="18" height="18" rx="4" fill="#60a5fa"/>
    <text x="772" y="395" fill="#cbd5e1">Equities / CFDs</text>
    <text x="1096" y="395" text-anchor="end" font-weight="700" fill="#ffffff">20%</text>

    <rect x="744" y="420" width="18" height="18" rx="4" fill="#3b82f6"/>
    <text x="772" y="435" fill="#cbd5e1">Commodities (XAU, Oil)</text>
    <text x="1096" y="435" text-anchor="end" font-weight="700" fill="#ffffff">12%</text>

    <rect x="744" y="460" width="18" height="18" rx="4" fill="#1e40af"/>
    <text x="772" y="475" fill="#cbd5e1">Cash Reserve (CAD)</text>
    <text x="1096" y="475" text-anchor="end" font-weight="700" fill="#ffffff">8%</text>
  </g>

  <!-- Stats footer -->
  <line x1="744" y1="510" x2="1096" y2="510" stroke="#1e3a8a" stroke-width="1"/>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">
    <text x="744" y="540">30-Day Return</text>
    <text x="744" y="568" font-size="22" font-weight="700" fill="#34d399">+ 8.4%</text>

    <text x="920" y="540">Volatility</text>
    <text x="920" y="568" font-size="22" font-weight="700" fill="#f59e0b">Moderate</text>

    <text x="744" y="612">Risk Score</text>
    <text x="744" y="640" font-size="22" font-weight="700" fill="#ffffff">5.2 / 10</text>

    <text x="920" y="612">Rebalanced</text>
    <text x="920" y="640" font-size="22" font-weight="700" fill="#ffffff">Weekly</text>
  </g>

  <!-- Bottom labels -->
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">
    <text x="80" y="730">Real-time data · AI-driven rebalancing · Cross-asset hedging</text>
  </g>
</svg>
